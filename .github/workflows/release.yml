name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-mac:
    needs: build-android
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Download Android APK for bundling
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: bundled-android-apk

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Test macOS
        run: |
          cd MacHost
          swift test

      - name: Build macOS (Universal Binary)
        run: |
          cd MacHost
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p .build/release-universal
          lipo -create \
            .build/arm64-apple-macosx/release/OpenMultiDisplay \
            .build/x86_64-apple-macosx/release/OpenMultiDisplay \
            -output .build/release-universal/OpenMultiDisplay

      - name: Create .app bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP_DIR="OpenMultiDisplay.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp MacHost/.build/release-universal/OpenMultiDisplay "$APP_DIR/Contents/MacOS/"

          # Copy icon if exists
          if [ -f "MacHost/Resources/AppIcon.icns" ]; then
            cp MacHost/Resources/AppIcon.icns "$APP_DIR/Contents/Resources/"
          fi

          if ls bundled-android-apk/*.apk >/dev/null 2>&1; then
            mkdir -p "$APP_DIR/Contents/Resources/Android"
            cp bundled-android-apk/*.apk "$APP_DIR/Contents/Resources/Android/OpenMultiDisplay-android.apk"
          fi

          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OpenMultiDisplay</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.batikanor.openmultidisplay</string>
              <key>CFBundleName</key>
              <string>OpenMultiDisplay</string>
              <key>CFBundleDisplayName</key>
              <string>OpenMultiDisplay</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <false/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>NSScreenCaptureUsageDescription</key>
              <string>OpenMultiDisplay needs screen recording access to capture your virtual display and stream it to your Android device.</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>OpenMultiDisplay needs Local Network access so your Android tablet can connect to the Mac over WiFi for wireless mode. Without this, only USB-tethered connections work.</string>
              <key>NSBonjourServices</key>
              <array>
                  <string>_openmultidisplay._tcp</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - "OpenMultiDisplay.app"

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dmg-content
          cp -R "OpenMultiDisplay.app" dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "OpenMultiDisplay" -srcfolder dmg-content -ov -format UDZO "OpenMultiDisplay-${VERSION}-mac-universal.dmg"
          rm -rf dmg-content

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: "*.dmg"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test Android
        run: |
          cd AndroidClient
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug

      - name: Build APK
        run: |
          cd AndroidClient
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp AndroidClient/app/build/outputs/apk/release/app-release.apk "OpenMultiDisplay-${VERSION}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: "*.apk"

  create-release:
    needs: [build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --oneline -10 --format="- %s")
          else
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD --format="- %s" | grep -v "^- chore:" | head -3)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "OpenMultiDisplay v${{ steps.version.outputs.version }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Universal) | `OpenMultiDisplay-${{ steps.version.outputs.version }}-mac-universal.dmg` |
            | Android | `OpenMultiDisplay-${{ steps.version.outputs.version }}-android.apk` |

            ### Installation
            - **macOS**: Open DMG, drag to Applications. If Gatekeeper says "damaged": `sudo xattr -cr "/Applications/OpenMultiDisplay.app"`
            - **Android**: Install APK (enable "Unknown sources" if needed)
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/android-apk/*.apk
          draft: false
          prerelease: false
